[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "h2" },
    { name = "ureq" },
    { name = "attohttpc" },
    { name = "isahc" },
    { name = "surf" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "tokio" },
    { name = "async-std" },
    { name = "smol" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "rustls" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
